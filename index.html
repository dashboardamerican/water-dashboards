<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI &amp; Water, In Context</title>
  <meta name="description" content="Three views of AI and data-center water use: national context, everyday comparisons, and accelerator efficiency across generations." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💧</text></svg>" />
  <style>
    :root {
      --bar-bg: #0e2438;
      --bar-ink: #cfe2f2;
      --bar-active-bg: #ffffff;
      --bar-active-ink: #0e2438;
      --bar-h: 56px;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      font-family: "Avenir Next", "Nunito Sans", "Helvetica Neue", sans-serif;
      background: #0e2438;
    }
    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--bar-h);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 14px;
      background: var(--bar-bg);
      color: var(--bar-ink);
      z-index: 10;
      box-shadow: 0 2px 12px rgba(4, 18, 30, 0.35);
    }
    .brand {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.02em;
      color: #ffffff;
      white-space: nowrap;
      margin-right: 4px;
    }
    .brand .drop { margin-right: 6px; }
    .tabs {
      display: flex;
      gap: 8px;
      flex: 1;
      min-width: 0;
    }
    .tab {
      display: flex;
      flex-direction: column;
      justify-content: center;
      border: 1px solid rgba(207, 226, 242, 0.35);
      border-radius: 10px;
      padding: 5px 14px;
      text-decoration: none;
      color: var(--bar-ink);
      line-height: 1.15;
      min-width: 0;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .tab:hover { background: rgba(255, 255, 255, 0.08); }
    .tab .t {
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tab .d {
      font-size: 10.5px;
      opacity: 0.75;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tab.active {
      background: var(--bar-active-bg);
      color: var(--bar-active-ink);
      border-color: var(--bar-active-bg);
    }
    .views {
      position: fixed;
      top: var(--bar-h);
      left: 0;
      right: 0;
      bottom: 0;
    }
    .views iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: none;
      background: #f4f7fa;
    }
    .views iframe.active { display: block; }
    @media (max-width: 640px) {
      .brand { display: none; }
      .tab .d { display: none; }
      .tab { padding: 8px 12px; }
    }
  </style>
</head>
<body>
  <nav class="topbar">
    <span class="brand"><span class="drop">💧</span>AI &amp; Water, In Context</span>
    <div class="tabs">
      <a class="tab" id="tab-big-picture" href="#big-picture">
        <span class="t">The Big Picture</span>
        <span class="d">US data centers vs other water uses</span>
      </a>
      <a class="tab" id="tab-daily-life" href="#daily-life">
        <span class="t">Your Daily Life</span>
        <span class="d">AI prompts in one person's water footprint</span>
      </a>
      <a class="tab" id="tab-accelerators" href="#accelerators">
        <span class="t">Hardware Efficiency</span>
        <span class="d">Water per million tokens by accelerator generation</span>
      </a>
    </div>
  </nav>
  <div class="views">
    <iframe id="view-big-picture" title="US Data Center Water Calculator" src="us_data_center_water_calc_explicit.html"></iframe>
    <iframe id="view-daily-life" title="Prompt Water Footprint, In Context" data-src="gemini_jacket_blue_equivalence.html"></iframe>
    <iframe id="view-accelerators" title="AI Accelerator Water Intensity" data-src="accelerator-energy-water/index.html"></iframe>
  </div>
  <script>
    const VIEWS = {
      "big-picture": { title: "AI & Water, In Context — The Big Picture" },
      "daily-life": { title: "AI & Water, In Context — Your Daily Life" },
      "accelerators": { title: "AI & Water, In Context — Hardware Efficiency" }
    };

    function currentView() {
      const key = window.location.hash.replace("#", "");
      return VIEWS[key] ? key : "big-picture";
    }

    function activate() {
      const key = currentView();
      Object.keys(VIEWS).forEach((k) => {
        const frame = document.getElementById(`view-${k}`);
        const tab = document.getElementById(`tab-${k}`);
        const on = k === key;
        // Lazy-load the inactive view the first time it is opened.
        if (on && !frame.src && frame.dataset.src) frame.src = frame.dataset.src;
        frame.classList.toggle("active", on);
        tab.classList.toggle("active", on);
      });
      document.title = VIEWS[key].title;
    }

    window.addEventListener("hashchange", activate);
    activate();
  </script>
</body>
</html>
